<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <!-- Add any external scripts and stylesheets here -->
    <script
      crossorigin
      src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/@mui/material@5.11.11/umd/material-ui.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/gas-client@1.1.1/dist/index.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/@types/react@18.2.66/index.d.ts"
    ></script>
  </head>
  <body>
    <section id="index">
      <style>
        .loading-container {
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          flex-direction: column;
          font-family: sans-serif;
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          background: white;
          z-index: 9999;
        }

        .spinner {
          border: 4px solid #f3f3f3;
          border-top: 4px solid #3498db;
          border-radius: 50%;
          width: 40px;
          height: 40px;
          animation: spin 1s linear infinite;
          margin-bottom: 16px;
        }

        @keyframes spin {
          0% {
            transform: rotate(0deg);
          }

          100% {
            transform: rotate(360deg);
          }
        }
      </style>
      <div class="loading-container">
        <div class="spinner"></div>
        <div>Loading...</div>
      </div>
      <script type="module" src="./index.jsx"></script>
      <!-- bundled js and css will get inlined here during build-->
    </section>
  </body>
</html>
